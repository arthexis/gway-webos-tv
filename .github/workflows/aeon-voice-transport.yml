name: AEon native voice transport
on:
  pull_request:
    paths:
      - 'experiments/aeon-rpg-player/voice_client.c'
      - 'experiments/aeon-rpg-player/voice_transport_build.sh'
      - '.github/workflows/aeon-voice-transport.yml'
      - 'tests/test_aeon_native_voice_client.py'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Acquire pinned dependencies
        run: |
          d="$RUNNER_TEMP/transport"
          mkdir "$d"
          base=https://raw.githubusercontent.com/cesanta/mongoose/02bdbb9ed6f0a8f7c42228c6e7cb35d748b60551
          for f in mongoose.c mongoose.h LICENSE; do curl -fLsS --retry 2 "$base/$f" -o "$d/$f"; done
          cd "$RUNNER_TEMP"
          f=arm-webos-linux-gnueabi_sdk-buildroot_linux-aarch64.tar.bz2
          curl -fLsS --retry 2 -o "$f" "https://github.com/webosbrew/native-toolchain/releases/download/webos-d7ed7ee.6/$f"
          echo "45a2d12ff557457d92cde4fddaa77a6f1090fca03adc43bb74397e5e0c379501  $f" | sha256sum -c
          tar -xjf "$f"
          cd arm-webos-linux-gnueabi_sdk-buildroot
          ./relocate-sdk.sh
          echo "WEBOS_SDK=$PWD" >> "$GITHUB_ENV"
      - name: Compile and check standalone ARM32 helper
        run: |
          out="$RUNNER_TEMP/voice-artifact"
          mkdir "$out"
          CC="$WEBOS_SDK/bin/arm-webos-linux-gnueabi-gcc" sh experiments/aeon-rpg-player/voice_transport_build.sh "$RUNNER_TEMP/transport" "$out/voice_client"
          readelf -h "$out/voice_client" | tee "$out/elf-header.txt"
          grep -E 'Class:.*ELF32' "$out/elf-header.txt"
          grep -E 'Machine:.*ARM$' "$out/elf-header.txt"
          readelf -l "$out/voice_client" | grep -F '/lib/ld-linux.so.3]'
          readelf -d "$out/voice_client" | tee "$out/elf-dynamic.txt"
          cp "$RUNNER_TEMP/transport/LICENSE" "$out/MONGOOSE-LICENSE"
          cd "$out"; sha256sum voice_client MONGOOSE-LICENSE > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: aeon-webos-arm-voice-client
          path: ${{ runner.temp }}/voice-artifact/
          if-no-files-found: error
