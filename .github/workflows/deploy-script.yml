name: Deploy script
on:
  pull_request:
    paths:
      - deploy.sh
      - tests/test_deploy_marker.sh
      - .github/workflows/deploy-script.yml
  push:
    branches: [main]
    paths:
      - deploy.sh
      - tests/test_deploy_marker.sh
      - .github/workflows/deploy-script.yml
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: sh -n deploy.sh tests/test_deploy_marker.sh
      - name: Validate deployment marker consistency
        run: sh tests/test_deploy_marker.sh
