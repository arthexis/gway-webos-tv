name: MCP offline release validation
on:
  pull_request:
    paths:
      - 'src/gway_webos_tv/mcp_*.py'
      - 'scripts/build_mcp_lock.py'
      - 'ansible/**'
      - 'tests/test_mcp_*.py'
      - '.github/workflows/mcp-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-wheelhouse:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare build dependencies in CI only
        run: python -m pip install --upgrade pip build packaging
      - name: Build application and full dependency wheelhouse
        run: python -m pip wheel . --wheel-dir /tmp/webos-wheels
      - name: Generate reviewed-format lock with real hashes
        run: python scripts/build_mcp_lock.py --wheelhouse /tmp/webos-wheels --output /tmp/webos-mcp.lock
      - name: Verify hashes and target wheel tags
        run: PYTHONPATH=src python -m gway_webos_tv.mcp_wheelhouse --lockfile /tmp/webos-mcp.lock --wheelhouse /tmp/webos-wheels
      - name: Verify offline installation with no index
        run: |
          python -m venv /tmp/webos-offline-venv
          /tmp/webos-offline-venv/bin/python -m pip install --no-index --find-links /tmp/webos-wheels --require-hashes -r /tmp/webos-mcp.lock
          /tmp/webos-offline-venv/bin/python -m pip check
          /tmp/webos-offline-venv/bin/python -c 'import gway_webos_tv.mcp_stdio'
      - name: Validate Ansible task syntax offline
        run: |
          python -m pip install ansible-core
          ansible-playbook --syntax-check -i localhost, -c local ansible/deploy.yml
