name: Deploy webOS TV via GWay Remote
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webos-tv-dispatch
  cancel-in-progress: false
jobs:
  verify:
    name: Verify main before dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest
      - name: Validate deployment scripts
        run: python -m py_compile scripts/auto-tv-deploy.py
  dispatch:
    name: Request gway-001 deployment
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch fixed workload to GWay Remote
        env:
          GH_TOKEN: ${{ secrets.GWAY_REMOTE_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo "::error::GWAY_REMOTE_DISPATCH_TOKEN missing"; exit 1; }
          gh api -X POST repos/arthexis/gway-remote/dispatches \
            -f event_type=webos-tv-deploy \
            -f client_payload[repository]=arthexis/gway-webos-tv \
            -f client_payload[sha]="$SHA"
          echo "::notice::Request accepted; deployment result is in arthexis/gway-remote Actions (Remote workloads)"
          echo "Deployment was requested, not yet verified." >> "$GITHUB_STEP_SUMMARY"
