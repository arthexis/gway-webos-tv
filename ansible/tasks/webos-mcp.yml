---
# Provider registration is part of normal installation, without a separate opt-in.
# Reuse the already installed application venv and authenticated federation.
- name: Resolve installed revision
  ansible.builtin.command:
    argv: [git, -C, "{{ gway_webos_repo }}", rev-parse, --verify, HEAD]
  register: webos_mcp_checkout_sha
  changed_when: false

- name: Verify installed MCP module using existing application environment
  ansible.builtin.command:
    argv:
      - "{{ gway_webos_repo }}/.venv/bin/python"
      - -c
      - "import gway_webos_tv.mcp_stdio"
  changed_when: false

- name: Inspect existing provider registry
  become: true
  ansible.builtin.stat:
    path: /etc/gway-mcp-providers
    follow: false
  register: webos_mcp_registry

- name: Require safe root-owned registry
  ansible.builtin.assert:
    that:
      - webos_mcp_registry.stat.isdir | default(false)
      - not (webos_mcp_registry.stat.islnk | default(false))
      - webos_mcp_registry.stat.pw_name == 'root'
      - webos_mcp_registry.stat.mode is match('^[0-7]*[0145][0145]$')

- name: Inspect existing provider manifest
  become: true
  ansible.builtin.stat:
    path: /etc/gway-mcp-providers/webos.json
    follow: false
  register: webos_mcp_old_manifest

- name: Refuse unsafe existing manifest
  ansible.builtin.assert:
    that:
      - not (webos_mcp_old_manifest.stat.islnk | default(false))
      - not (webos_mcp_old_manifest.stat.exists | default(false)) or (webos_mcp_old_manifest.stat.isreg | default(false) and webos_mcp_old_manifest.stat.pw_name == 'root')

- name: Install root-owned MCP launcher using existing application venv
  become: true
  ansible.builtin.copy:
    dest: /usr/local/bin/gway-webos-mcp
    owner: root
    group: root
    mode: '0755'
    content: |
      #!/bin/sh
      exec "{{ gway_webos_repo }}/.venv/bin/python" -m gway_webos_tv.mcp_stdio "$@"

- name: Verify launcher and render node-owned manifest
  ansible.builtin.command:
    argv:
      - "{{ gway_webos_repo }}/.venv/bin/python"
      - -m
      - gway_webos_tv.mcp_manifest
      - --revision
      - "{{ webos_mcp_checkout_sha.stdout }}"
      - --executable
      - /usr/local/bin/gway-webos-mcp
  register: webos_mcp_manifest
  changed_when: false

- name: Assert manifest identity
  ansible.builtin.assert:
    that:
      - (webos_mcp_manifest.stdout | from_json).source_id == 'webos'
      - (webos_mcp_manifest.stdout | from_json).revision == webos_mcp_checkout_sha.stdout
      - (webos_mcp_manifest.stdout | from_json).argv == ['/usr/local/bin/gway-webos-mcp']

- name: Atomically publish provider manifest
  become: true
  ansible.builtin.copy:
    content: "{{ webos_mcp_manifest.stdout | from_json | to_nice_json }}\n"
    dest: /etc/gway-mcp-providers/webos.json
    owner: root
    group: root
    mode: '0644'
